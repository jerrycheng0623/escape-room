<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">張萍的隱藏診療紀錄</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">保密附記｜五年前事件</tspan><tspan x="72" dy="42">王杰倫自述受困多日，在極端飢餓中，疑似食用了已死亡親屬的</tspan><tspan x="72" dy="42">遺體。</tspan><tspan x="72" dy="42">後續反覆提及難以面對的進食記憶與異常欲望。此項記錄僅供診</tspan><tspan x="72" dy="42">療，不足以證明本次案件任何人的犯罪行為。</tspan><tspan x="72" dy="42">【偵探重建：先有五年前火災與受困，才有食用遺體的往事；這</tspan><tspan x="72" dy="42">次聚會的縱火，則是另一件事。】</tspan></text></svg>