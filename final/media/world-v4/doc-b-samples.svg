<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"><rect width="1000" height="760" fill="#c8b994"/><text x="65" y="90" fill="#493a27" font-size="32" font-family="serif">沖印工作小樣袋</text><text x="65" y="160" fill="#382e20" font-size="24" font-family="serif">本次工作卷 K；27 起，換電池後跳號至31。跳號不代表另一卷。</text><text x="65" y="203" fill="#382e20" font-size="24" font-family="serif">原邊字可正讀；翻拍袋按翻拍批號另存，不併原卷。</text></svg>