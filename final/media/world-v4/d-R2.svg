<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="760" viewBox="0 0 1000 760"><defs><filter id="grain"><feTurbulence baseFrequency=".4" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs><rect width="1000" height="760" fill="#202720"/><rect x="28" y="25" width="944" height="710" rx="10" fill="#cbbd9a" stroke="#8b7051" stroke-width="5" filter="url(#grain)"/><text x="65" y="82" fill="#443423" font-family="serif" font-size="28">診療散頁 · 椅墊下</text><rect x="510" y="125" width="420" height="480" fill="#b0c9b2" fill-opacity=".27" stroke="#6b7d6d"/><path d="M530 150V130H550" fill="none" stroke="#473e2f" stroke-width="4"/><circle cx="565" cy="235" r="20" fill="#202720" stroke="#66563d"/><circle cx="705" cy="235" r="20" fill="#202720" stroke="#66563d"/><circle cx="565" cy="425" r="20" fill="#202720" stroke="#66563d"/><circle cx="705" cy="425" r="20" fill="#202720" stroke="#66563d"/><path d="M705 425L565 235" stroke="#54432c" stroke-width="4" fill="none"/><text x="65" y="140" fill="#342d22" font-family="serif" font-size="20">WJ-</text><text x="65" y="172" fill="#342d22" font-family="serif" font-size="20">05｜案史範圍｜此處只記錄五年前的經歷，不</text><text x="65" y="204" fill="#342d22" font-family="serif" font-size="20">是對其他事件的鑑定。</text><text x="65" y="248" fill="#342d22" font-family="serif" font-size="20">個案對炭火、封閉空間與進食出現反覆聯想。心</text><text x="65" y="280" fill="#342d22" font-family="serif" font-size="20">理狀態及病史紀錄不能替代其他案件的物證調查</text><text x="65" y="312" fill="#342d22" font-family="serif" font-size="20">。</text><text x="65" y="690" fill="#69553a" font-family="serif" font-size="16">背面另有文字，可翻面查看</text></svg>