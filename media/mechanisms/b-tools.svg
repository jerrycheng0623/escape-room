<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="#c7b591"/><path d="M28 28H932V592H28Z" fill="none" stroke="#746347" stroke-width="3"/><g fill="#352f25" font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="64" y="94" font-size="38">攝影工具使用便條</text><path d="M64 124H890" stroke="#746347"/><text x="64" y="175" font-size="27">套片架收納套：色片拆洗後入袋；金屬架放回三角記號一側。</text><text x="64" y="218" font-size="27">工具便條：定位時我看桌上那一份，不看手裡這一份。燈座別挪，</text><text x="64" y="261" font-size="27">位置才會一樣。</text><text x="64" y="304" font-size="27">底片框保養貼：前把手拉不動時請先檢查底扣；勿硬扯。</text></g></svg>