<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="#c7b591"/><path d="M28 28H932V592H28Z" fill="none" stroke="#746347" stroke-width="3"/><g fill="#352f25" font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="64" y="94" font-size="38">沖印工作小樣袋</text><path d="M64 124H890" stroke="#746347"/><text x="64" y="175" font-size="27">小樣只認邊碼，別照收納順序配。大圖再清楚，邊條不合也不能交</text><text x="64" y="218" font-size="27">件。</text><text x="64" y="261" font-size="27">兩張小樣均可取出並排查看；照片與小樣上的不對稱缺口、沖印批</text><text x="64" y="304" font-size="27">號，應各自吻合。</text><text x="64" y="347" font-size="27">此處為數位圖層校正的工作預覽，不代表普通彩色玻璃的物理效果</text><text x="64" y="390" font-size="27">。</text></g></svg>