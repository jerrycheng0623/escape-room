<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">烤架下緣的項鍊</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">開口六角墜飾、斜桿與右上缺口，輪廓與第一照劉涵佩戴者一致</tspan><tspan x="72" dy="42">。</tspan><tspan x="72" dy="42">鏈勾在烤架下緣遮蔽處，開啟暗格後才可伸手取到。</tspan><tspan x="72" dy="42">這支持劉涵與烤架的關聯，不單獨證明其身分或人體曾在架上。</tspan></text></svg>