<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">表層診療報告副本</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">張萍｜個案記錄 王杰倫</tspan><tspan x="72" dy="42">患者對火光與聚會場合呈現強烈不安。近期反覆描述五年前受困</tspan><tspan x="72" dy="42">的夢境。</tspan><tspan x="72" dy="42">此為個案觀察，不等同暴力風險判決，亦不能用診斷決定當晚犯</tspan><tspan x="72" dy="42">罪責任。</tspan><tspan x="72" dy="42">【警方提供可見層副本；原件位於地下診療區公事包，下半部另</tspan><tspan x="72" dy="42">有遮蔽。】</tspan></text></svg>