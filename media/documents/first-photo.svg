<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">18:30第一張合照</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">鏡頭前：王杰倫、林依瑤、張萍、劉涵。</tspan><tspan x="72" dy="42">鏡頭後：劉子傑。偵探尚未到場。</tspan><tspan x="72" dy="42">劉涵佩戴開口六角墜飾，斜桿與右上缺口可辨。</tspan><tspan x="72" dy="42">時刻另與手機工作紀錄及拍攝順序交叉核對。</tspan></text></svg>