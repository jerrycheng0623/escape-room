<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">聚會邀請函</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">致老朋友們：</tspan><tspan x="72" dy="42">五年前的大火奪走了一切，也讓我重新學習生活。這個週末，請</tspan><tspan x="72" dy="42">到山中小屋，與我一起為過去畫下句點。</tspan><tspan x="72" dy="42">傍晚六點，營火與餐點會準備妥當。</tspan><tspan x="72" dy="42">王杰倫</tspan></text></svg>