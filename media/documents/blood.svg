<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">儲藏室擦拭痕跡</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">地面有粗糙擦拭過的暗色血痕，旁邊是破錶與撞擊痕。</tspan><tspan x="72" dy="42">警方已標記取樣，當晚結果未出。</tspan><tspan x="72" dy="42">先記錄位置與相對關係，不以肉眼判定血液屬於誰。</tspan></text></svg>