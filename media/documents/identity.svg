<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">數日後：正式身分核對</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">案件後續通知</tspan><tspan x="72" dy="42">經多來源資料交叉核對，四名死者為：林依瑤、劉子傑、劉涵、</tspan><tspan x="72" dy="42">張萍。</tspan><tspan x="72" dy="42">王杰倫不在四名死者之中，仍在追查。</tspan><tspan x="72" dy="42">取樣與影像資料支持劉涵火前已受致命襲擊；三杯與空瓶有一致</tspan><tspan x="72" dy="42">的鎮靜物質線索。</tspan><tspan x="72" dy="42">本通知完成於現場調查之後，不是當晚機關一解開就即時得到的</tspan><tspan x="72" dy="42">檢驗。</tspan></text></svg>