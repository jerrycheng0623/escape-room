<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">02:30現場通報</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">火勢已撲滅。現場清點四具成年人焦屍，身分待驗。</tspan><tspan x="72" dy="42">主門門栓由內側扣合；起火原因仍在調查。</tspan><tspan x="72" dy="42">03:00補註：偵探已到封鎖線外。僅准沿警員標記的安全動線調</tspan><tspan x="72" dy="42">查；地下區須待現場人員確認。</tspan><tspan x="72" dy="42">反鎖只描述主門狀態，不代表已排除其他出口。</tspan></text></svg>