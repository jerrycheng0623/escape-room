<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">虛構UV調查模組</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">標記UV的調查燈模組。</tspan><tspan x="72" dy="42">由現場人員交付，收納於C通D前的維修箱，與調查手電的相容</tspan><tspan x="72" dy="42">介面連接。</tspan><tspan x="72" dy="42">這是遊戲道具，不需要接觸帶電配電盤，也不把普通保險絲當作</tspan><tspan x="72" dy="42">紫外線光源。</tspan></text></svg>