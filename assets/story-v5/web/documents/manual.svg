<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">測重卡榫維修銘牌</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">服務模式：以指定歷史校正載重重新下壓，可解除底座檢修卡榫</tspan><tspan x="72" dy="42">。</tspan><tspan x="72" dy="42">容差：±0.5 kg；穩定0.5秒後開啟。</tspan><tspan x="72" dy="42">超過70 kg僅發出超載提醒；先取下重物再調整。</tspan><tspan x="72" dy="42">可用重物：木樁15 kg、鐵塊20 kg、沙袋10 kg、石塊5 kg，</tspan><tspan x="72" dy="42">各兩件。</tspan><tspan x="72" dy="42">物品可隨時取回，請勿以固定烤架本體作配重。</tspan></text></svg>