<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">維修出口痕跡</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">門框鏽面有新刮痕，遮蔽接縫留有油痕，外層覆著細灰。</tspan><tspan x="72" dy="42">支持開門／維修早於覆灰與倒櫃；不能只憑痕跡認人或精確定時</tspan><tspan x="72" dy="42">。</tspan><tspan x="72" dy="42">通路連往森林。主門反鎖不代表所有出口封死，王杰倫可能已逃</tspan><tspan x="72" dy="42">離。</tspan></text></svg>