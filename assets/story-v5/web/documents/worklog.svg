<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">攝影師工作紀錄</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">警方取得的手機工作副本：</tspan><tspan x="72" dy="42">18:29：劉子傑調整相機，手機留有構圖預覽與電子鐘。</tspan><tspan x="72" dy="42">18:30：第一聲快門，劉涵仍在。</tspan><tspan x="72" dy="42">19:14：劉涵與王杰倫先後走向儲藏室。</tspan><tspan x="72" dy="42">19:15：短片收進突發撞擊聲，之後中斷。</tspan><tspan x="72" dy="42">19:29：王杰倫在張萍公事包旁拿起同形小瓶。影像未拍到瓶內</tspan><tspan x="72" dy="42">成分或倒入飲品。</tspan><tspan x="72" dy="42">20:00：第二次快門，鏡頭前三人。</tspan><tspan x="72" dy="42">20:30：三名賓客坐臥客廳，未回應掌鏡者先前留下的自動錄影</tspan><tspan x="72" dy="42">。</tspan><tspan x="72" dy="42">這是零散工作片段，不是完整犯罪錄影。</tspan></text></svg>