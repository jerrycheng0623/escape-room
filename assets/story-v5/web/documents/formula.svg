<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">調查箱算式紙片</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">採訪日 = a₁</tspan><tspan x="72" dy="42">受訪者房號 = a₂</tspan><tspan x="72" dy="42">密碼 = a₅</tspan><tspan x="72" dy="42">當n≥3時：aₙ = 2aₙ₋₁ + aₙ₋₂</tspan><tspan x="72" dy="42">門牌的前導零不改變數值。</tspan></text></svg>