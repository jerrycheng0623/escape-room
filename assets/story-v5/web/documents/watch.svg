<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">19:15破裂手錶</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">男用運動手錶，指針停在19:15。</tspan><tspan x="72" dy="42">與儲藏室撞擊痕跡、血痕及工作片段交叉，支持該時段發生衝突</tspan><tspan x="72" dy="42">。</tspan><tspan x="72" dy="42">手錶讀數不是死亡時間鑑定，不能單靠它確定主人或死因。</tspan></text></svg>