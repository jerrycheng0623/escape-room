<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">五年前新聞剪報</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">《深山住宅火災，疑點仍待釐清》</tspan><tspan x="72" dy="42">山區住宅發生大火，救援受道路中斷影響。現場資料與後續救援</tspan><tspan x="72" dy="42">結果仍有待核實，警方持續調查。</tspan><tspan x="72" dy="42">撰稿：林依瑤</tspan><tspan x="72" dy="42">【偵探註記：報導省略了她私下持有的部分資料。這不足以證明</tspan><tspan x="72" dy="42">她犯下今晚的罪行。】</tspan></text></svg>