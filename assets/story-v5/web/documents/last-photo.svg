<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">20:00最後合照</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">鏡頭前：王杰倫、林依瑤、張萍。</tspan><tspan x="72" dy="42">劉子傑掌鏡，劉涵未入鏡。</tspan><tspan x="72" dy="42">同一木牆、電子鐘、服裝與連續拍攝紀錄支持是同晚的第二次拍</tspan><tspan x="72" dy="42">攝。</tspan><tspan x="72" dy="42">缺席本身不能證明死亡。</tspan></text></svg>