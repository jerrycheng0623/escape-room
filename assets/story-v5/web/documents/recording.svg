<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">當晚案件重建</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">19:10，劉涵準備向王杰倫道歉。19:15附近，儲藏室發生撞擊</tspan><tspan x="72" dy="42">，烤架留下異常載重。</tspan><tspan x="72" dy="42">工作片段顯示王杰倫取過小瓶，其餘三人後來失去活動；三杯殘</tspan><tspan x="72" dy="42">留仍待檢驗。</tspan><tspan x="72" dy="42">照片、日記、項鍊與深層紀錄相互支持一個駭人的方向：劉涵可</tspan><tspan x="72" dy="42">能在合照前遭襲，並與烤架異常有關。</tspan><tspan x="72" dy="42">這是案件重建，精確死時、物質與身分仍須正式核對。</tspan></text></svg>