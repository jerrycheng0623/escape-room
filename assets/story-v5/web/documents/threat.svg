<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">被撕碎的威脅信</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">妳當年明明握有能繼續追查的資料，卻為了懸案熱度，把真相壓</tspan><tspan x="72" dy="42">了下來。</tspan><tspan x="72" dy="42">來參加這次聚會。否則，我會把妳隱匿線索的事公諸於世。</tspan><tspan x="72" dy="42">王杰倫</tspan></text></svg>