<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">劉涵的日記殘頁</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">19:10紀錄</tspan><tspan x="72" dy="42">今晚準備了5公斤肉品，希望杰倫能開心。</tspan><tspan x="72" dy="42">他看著營火一直發抖，眼神直勾勾的，口水流個不停。</tspan><tspan x="72" dy="42">我不該讓他想起那場火。我待會拉他去儲藏室，好好向他道歉。</tspan></text></svg>