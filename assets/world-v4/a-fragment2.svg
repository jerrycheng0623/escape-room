<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="760" viewBox="0 0 1000 760"><defs><filter id="grain"><feTurbulence baseFrequency=".4" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs><rect width="1000" height="760" fill="#202720"/><rect x="28" y="25" width="944" height="710" rx="10" fill="#cbbd9a" stroke="#8b7051" stroke-width="5" filter="url(#grain)"/><text x="65" y="82" fill="#443423" font-family="serif" font-size="28">逐字稿殘頁 · 廢紙簍</text><text x="65" y="145" fill="#342d22" font-family="serif" font-size="20">R3 原始錄音逐字稿｜段落 3｜11月校訂</text><text x="65" y="189" fill="#342d22" font-family="serif" font-size="20">林：您說收納的位置以前修過？</text><text x="65" y="233" fill="#342d22" font-family="serif" font-size="20">屋主：是，先向上提到底，再往牆裡壓，板子才會鬆。</text><text x="65" y="277" fill="#342d22" font-family="serif" font-size="20">林：謝謝，接下來還是回到那則報導的受訪來源。</text><text x="65" y="690" fill="#69553a" font-family="serif" font-size="16">背面另有文字，可翻面查看</text></svg>