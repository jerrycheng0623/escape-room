<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"><rect width="1000" height="760" fill="#c8b994"/><text x="65" y="90" fill="#493a27" font-size="32" font-family="serif">公事包整理卡</text><text x="65" y="160" fill="#382e20" font-size="24" font-family="serif">問句留在待核實夾；記錄與使用限制，歸案史。兩類不得合抄。</text><text x="65" y="203" fill="#382e20" font-size="24" font-family="serif">索引台側使用圖：定位紙、透孔撥片、拉匣。</text></svg>