<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"><rect width="1000" height="760" fill="#c8b994"/><text x="65" y="90" fill="#493a27" font-size="32" font-family="serif">攝影工具使用便條</text><text x="65" y="160" fill="#382e20" font-size="24" font-family="serif">先留構圖預覽，再拍正式照。第二次快門之間換了電池；這不是連拍。</text><text x="65" y="203" fill="#382e20" font-size="24" font-family="serif">驗片匣使用圖：夾帶進軌、轉輸送輪、提起回捲軸。</text></svg>