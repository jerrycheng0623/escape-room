<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"><rect width="1000" height="760" fill="#c8b994"/><text x="65" y="90" fill="#493a27" font-size="32" font-family="serif">箱側結構貼紙</text><text x="65" y="160" fill="#382e20" font-size="24" font-family="serif">一排六個日用掛鉤。靠窗端到靠門端方向固定；每鉤均可提、壓、拉與輕轉。第六</text><text x="65" y="203" fill="#382e20" font-size="24" font-family="serif">鉤細線連至清點鈴盒。</text></svg>