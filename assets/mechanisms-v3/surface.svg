<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" fill="#c7b591"/><path d="M28 28H932V592H28Z" fill="none" stroke="#746347" stroke-width="3"/><g fill="#352f25" font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="64" y="94" font-size="38">表層診療報告副本</text><path d="M64 124H890" stroke="#746347"/><text x="64" y="175" font-size="27">張萍｜個案記錄 王杰倫</text><text x="64" y="218" font-size="27">患者對火光與聚會場合呈現強烈不安。近期反覆描述五年前受困的</text><text x="64" y="261" font-size="27">夢境。</text><text x="64" y="304" font-size="27">此為個案觀察，不等同暴力風險判決，亦不能用診斷決定當晚犯罪</text><text x="64" y="347" font-size="27">責任。</text><text x="64" y="390" font-size="27">【警方提供可見層副本；原件位於地下診療區公事包，下半部另有</text><text x="64" y="433" font-size="27">遮蔽。】</text><text x="64" y="476" font-size="27">資料袋：轉存，可見層副本另袋，原附頁保留。個案編號</text><text x="64" y="519" font-size="27">WJ-05 見頁邊。</text><text x="64" y="562" font-size="27">袋內半透明原附頁一併保存，並非可見層副本本身。</text></g></svg>