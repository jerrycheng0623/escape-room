<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650"><defs><pattern id="p" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 0h8v8H0zM8 8h8v8H8z" fill="white"/></pattern><mask id="m"><rect width="1000" height="650" fill="url(#p)"/></mask></defs><rect width="1000" height="650" fill="#b4a785" opacity=".45"/><g stroke="#494a36" fill="none" stroke-width="4"><circle cx="48" cy="85" r="9"/><path d="M914 85h40M35 580l18 14-18 14"/></g><text x="65" y="59" font-family="sans-serif" font-size="22">WJ-05 · 裝訂面</text><g mask="url(#m)" font-family="PingFang TC,sans-serif" fill="#3b4030"><text x="85" y="147.5" font-size="24">王杰倫自述受困多日，在極端飢餓中，疑似食用了已死亡親屬的遺體。</text><text x="85" y="230.0" font-size="21">歸檔②／圓孔</text><text x="85" y="316.5" font-size="24">後續反覆提及難以面對的進食記憶與異常欲望。此項記錄僅供診療，不足以證</text><text x="85" y="343.5" font-size="24">明本次案件任何人的犯罪行為。</text><text x="85" y="399.0" font-size="21">歸檔③／斜槽</text><text x="85" y="485.5" font-size="24">【偵探重建：先有五年前火災與受困，才有食用遺體的往事；這次聚會的縱火</text><text x="85" y="512.5" font-size="24">，則是另一件事。】</text><text x="85" y="568.0" font-size="21">歸檔①／雙短線</text></g></svg>