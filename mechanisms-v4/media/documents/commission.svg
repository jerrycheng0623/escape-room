<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">委託聯絡紀錄</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">林依瑤：我收到了王杰倫的邀請，也收到一封威脅信。我會先赴</tspan><tspan x="72" dy="42">約，你能暗中來看著我嗎？</tspan><tspan x="72" dy="42">偵探：保持聯絡。若情況不對，先離開，不要等我。</tspan><tspan x="72" dy="42">林依瑤：邀請函副本已附上。我不希望其他人知道這件事。</tspan><tspan x="72" dy="42">【山路故障使行程耽擱四小時。最後聯絡未獲回覆。】</tspan></text></svg>