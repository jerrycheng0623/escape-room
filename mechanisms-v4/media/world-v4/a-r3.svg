<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="760" viewBox="0 0 1000 760"><defs><filter id="grain"><feTurbulence baseFrequency=".4" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs><rect width="1000" height="760" fill="#202720"/><rect x="28" y="25" width="944" height="710" rx="10" fill="#cbbd9a" stroke="#8b7051" stroke-width="5" filter="url(#grain)"/><text x="65" y="82" fill="#443423" font-family="serif" font-size="28">採訪整理稿 · 書桌</text><text x="65" y="145" fill="#342d22" font-family="serif" font-size="20">R3｜正式校樣</text><text x="65" y="189" fill="#342d22" font-family="serif" font-size="20">段落一：林問撤稿後來源是否願意再談；屋主回答還沒回信。林將原件另留一份，見報版本未交代</text><text x="65" y="221" fill="#342d22" font-family="serif" font-size="20">來源說法。</text><text x="65" y="265" fill="#342d22" font-family="serif" font-size="20">段落二：屋主說旅館只有清點時才搬動東西。林會保留當日手寫修訂，再核對引述。</text><text x="65" y="309" fill="#342d22" font-family="serif" font-size="20">段落三：屋主說收納位置曾修過。林致謝，話題回到那則報導的受訪來源。</text><text x="65" y="690" fill="#69553a" font-family="serif" font-size="16">背面另有文字，可翻面查看</text></svg>