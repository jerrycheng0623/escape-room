<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"><rect width="1000" height="760" fill="#c8b994"/><text x="65" y="90" fill="#493a27" font-size="32" font-family="serif">平衡支架維修分解圖</text><text x="65" y="160" fill="#382e20" font-size="24" font-family="serif">人工維修升降總成等效負載70 kg，與歷史65 kg不是同一紀錄。</text><text x="65" y="203" fill="#382e20" font-size="24" font-family="serif">兩股托同一輪，籃落兩格、框升一格；平衡時用手輪送框。</text><text x="65" y="246" fill="#382e20" font-size="24" font-family="serif">舊鉤改清點用，負載改走柱後雙螺栓座。</text></svg>