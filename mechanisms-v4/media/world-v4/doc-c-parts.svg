<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"><rect width="1000" height="760" fill="#c8b994"/><text x="65" y="90" fill="#493a27" font-size="32" font-family="serif">K2／F1／G1 零件資料</text><text x="65" y="160" fill="#382e20" font-size="24" font-family="serif">吊籃額定40 kg；舊清點鉤額定20</text><text x="65" y="203" fill="#382e20" font-size="24" font-family="serif">kg。超載滑脫至近地承接座，卸重後扣回。</text><text x="65" y="246" fill="#382e20" font-size="24" font-family="serif">繩路可退回重接，蓋到止點由機械支撐銷接手。</text></svg>