<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">地下室內門鑰匙</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">底座暗格內的維修鑰匙。</tspan><tspan x="72" dy="42">標記：通往地下診療區的內門。</tspan><tspan x="72" dy="42">不是對外維修出口鑰匙。門開啟後保持解鎖，不重複消耗。</tspan></text></svg>