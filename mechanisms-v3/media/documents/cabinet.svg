<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">火後倒櫃與滑座</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">倒櫃位於地下維修儲物凹間，與C襲擊儲藏室不同。</tspan><tspan x="72" dy="42">警方固定櫃體並準備滑座把手，確認後才可移開。</tspan><tspan x="72" dy="42">火中倒落位置與灰層關係，支持出口不是從頭到尾被堵住。</tspan></text></svg>