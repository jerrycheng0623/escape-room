<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900"><rect width="960" height="900" fill="#c3b08a"/><rect x="26" y="26" width="908" height="848" fill="none" stroke="#6c5738" stroke-width="3"/><text x="72" y="100" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="38">林依瑤的隱藏筆記</text><path d="M72 130H888" stroke="#685236"/><text x="72" y="145" fill="#382c20" font-family="STHeiti,Microsoft JhengHei,sans-serif" font-size="28"><tspan x="72" dy="42">18:45紀錄</tspan><tspan x="72" dy="42">我明明握有能讓人繼續追查五年前事件的資料，卻把線索壓了下</tspan><tspan x="72" dy="42">來，把報導寫成找不到兇手的懸案。</tspan><tspan x="72" dy="42">我太害怕失去獨家帶來的名聲。今晚他約我來，眼神好可怕。我</tspan><tspan x="72" dy="42">該怎麼辦？</tspan></text></svg>