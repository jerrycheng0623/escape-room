<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920"><rect width="960" height="920" fill="#c7b591"/><path d="M28 28H932V892H28Z" fill="none" stroke="#746347" stroke-width="3"/><g fill="#352f25" font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="64" y="94" font-size="38">平衡支架維修分解圖</text><path d="M64 124H890" stroke="#746347"/><text x="64" y="175" font-size="27">承接以退出總成為準。剖面填紋處隨匣移動，底座平台不列入。</text><text x="64" y="218" font-size="27">K2 內芯、F1 襯框、G1</text><text x="64" y="261" font-size="27">隨動導座皆隨匣退出；底座平台留在原位。</text><text x="64" y="304" font-size="27">支架側牌：服務側接手後才可側移；退出後止回。</text><text x="64" y="347" font-size="27">舊維修紀錄：上次只按內芯質量驗收，襯框和導座都還在，難怪指</text><text x="64" y="390" font-size="27">針沒回來。</text><text x="64" y="433" font-size="27">超過 70 kg 只提醒超載；可取回配重。</text><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 3L3-3M0 12L12 0M9 15L15 9" stroke="#837255" stroke-width="2"/></pattern></defs><g transform="translate(65 640)"><rect width="650" height="180" fill="url(#hatch)" stroke="#423f31" stroke-width="5"/><rect x="25" y="30" width="320" height="110" fill="#c0ae87" stroke="#423f31" stroke-width="5"/><text x="45" y="85" font-size="28">K2 內芯 50 kg</text><text x="385" y="85" font-size="28">F1 襯框 10 kg</text><path d="M0 200H650" stroke="#423f31" stroke-width="12"/><text x="0" y="245" font-size="24">G1 隨動導座 5 kg · 填紋皆隨匣退出</text><path d="M700 15h70v175h-70z" fill="none" stroke="#423f31"/><text x="680" y="230" font-size="19">固定平台</text></g></g></svg>